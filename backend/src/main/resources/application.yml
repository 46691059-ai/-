spring:
  application:
    name: enterprise-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/enterprise_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${DB_USERNAME:enterprise}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: EnterprisePlatformHikariPool
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 30000
      validation-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  database:
    mapping-check:
      enabled: ${DB_MAPPING_CHECK_ENABLED:true}
  security:
    permission-cache-ttl-seconds: ${PERMISSION_CACHE_TTL_SECONDS:1800}
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
      issuer: ${JWT_ISSUER:enterprise-platform}
      audience: ${JWT_AUDIENCE:enterprise-platform-api}
  web:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  config: classpath:logback-spring.xml

integration:
  workflow:
    base-url: ${WORKFLOW_BASE_URL:http://127.0.0.1:8090}
    service-token: ${WORKFLOW_SERVICE_TOKEN:}
    callback-token: ${WORKFLOW_CALLBACK_TOKEN:}
    decision-definition-key: ${WORKFLOW_DECISION_DEFINITION_KEY:investment-decision}
    decision-definition-version: ${WORKFLOW_DECISION_DEFINITION_VERSION:1}
    reliability:
      worker-enabled: ${WORKFLOW_OUTBOX_WORKER_ENABLED:false}
      batch-size: ${WORKFLOW_OUTBOX_BATCH_SIZE:100}
      worker-threads: ${WORKFLOW_OUTBOX_WORKER_THREADS:4}
      max-retries: ${WORKFLOW_OUTBOX_MAX_RETRIES:8}
      lock-seconds: ${WORKFLOW_OUTBOX_LOCK_SECONDS:60}
      base-retry-seconds: ${WORKFLOW_OUTBOX_BASE_RETRY_SECONDS:30}
      max-retry-seconds: ${WORKFLOW_OUTBOX_MAX_RETRY_SECONDS:1800}
      scan-delay-millis: ${WORKFLOW_OUTBOX_SCAN_DELAY_MILLIS:1000}
      gap-scan-delay-millis: ${WORKFLOW_INBOX_GAP_SCAN_DELAY_MILLIS:5000}
    security:
      current-key-id: ${WORKFLOW_HMAC_CURRENT_KEY_ID:}
      current-secret: ${WORKFLOW_HMAC_CURRENT_SECRET:}
      previous-key-id: ${WORKFLOW_HMAC_PREVIOUS_KEY_ID:}
      previous-secret: ${WORKFLOW_HMAC_PREVIOUS_SECRET:}
      allowed-skew-seconds: ${WORKFLOW_HMAC_ALLOWED_SKEW_SECONDS:300}
      nonce-ttl-seconds: ${WORKFLOW_HMAC_NONCE_TTL_SECONDS:600}
