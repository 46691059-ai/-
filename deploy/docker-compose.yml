name: enterprise-platform

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${DB_NAME:-enterprise_platform}
      MYSQL_USER: ${DB_USERNAME:-enterprise}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_INITDB_SKIP_TZINFO: "1"
    secrets:
      - mysql_app_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/enterprise.cnf:ro
      - ../database/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -uroot
          -p"$$(cat /run/secrets/mysql_root_password)" --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: &container_logging
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-20m}
        max-file: "${LOG_MAX_FILES:-10}"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2g}
    cpus: ${MYSQL_CPU_LIMIT:-2.0}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/enterprise/redis-entrypoint.sh"]
    environment:
      TZ: Asia/Shanghai
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./scripts/redis-entrypoint.sh:/opt/enterprise/redis-entrypoint.sh:ro
    tmpfs:
      - /run/redis-auth:size=1m,mode=0700
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning
          --pass "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *container_logging
    security_opt:
      - no-new-privileges:true
    mem_limit: ${REDIS_MEMORY_LIMIT:-768m}
    cpus: ${REDIS_CPU_LIMIT:-1.0}

  mysql-slowlog:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while [ ! -f /var/lib/mysql/slow-query.log ]; do sleep 2; done;
        exec tail -n 0 -F /var/lib/mysql/slow-query.log
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mysql_data:/var/lib/mysql:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging: *container_logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25

  backend:
    image: ${BACKEND_IMAGE:-enterprise-platform-backend:1.0.0}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-enterprise_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=false
      DB_USERNAME: ${DB_USERNAME:-enterprise}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      JWT_ISSUER: ${JWT_ISSUER:-enterprise-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-enterprise-platform-api}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-7200}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    secrets:
      - source: mysql_app_password
        target: spring.datasource.password
      - source: redis_password
        target: spring.data.redis.password
      - source: jwt_secret
        target: app.security.jwt.secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 3 -O /dev/null
          http://127.0.0.1:8080/api/actuator/health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging: *container_logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536m}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    stop_grace_period: 45s

  frontend:
    image: ${FRONTEND_IMAGE:-enterprise-platform-frontend:1.0.0}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=64m,mode=0755
    logging: *container_logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  redis_data:

secrets:
  mysql_app_password:
    file: ./secrets/mysql_app_password.txt
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
